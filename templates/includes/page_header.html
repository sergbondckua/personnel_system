<div class="page-header">

  <div class="page-header__top">

    <div>

      <h1 class="page-header__title">
        {{ page.title }}
      </h1>

      {% if page.subtitle %}
        <div class="page-header__subtitle">
          {{ page.subtitle }}
        </div>
      {% endif %}

    </div>

    {% if page.navigation %}

      <div class="page-header__navigation">

        <a
            class="btn btn-outline-secondary btn-sm btn-icon"
            href="?year={{ page.navigation.previous_year }}&month={{ page.navigation.previous_month }}"
        >
          ←
        </a>

        <a
            class="btn btn-outline-secondary btn-sm btn-icon"
            href="?year={{ page.navigation.next_year }}&month={{ page.navigation.next_month }}"
        >
          →
        </a>

      </div>

    {% endif %}

  </div>

</div>
