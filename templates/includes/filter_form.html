<form method="get" class="filter-bar">

  {% for field in form %}

    <div class="filter-bar__field">

      {{ field.label_tag }}

      {{ field }}

      {% if field.errors %}
        <div class="text-danger small">
          {{ field.errors }}
        </div>
      {% endif %}

    </div>

  {% endfor %}

  <div class="filter-bar__actions">

    <button
        type="submit"
        class="btn btn-primary"
    >
      Застосувати
    </button>

  </div>

</form>
